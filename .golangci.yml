version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks: [hugeParam, rangeValCopy, paramTypeCombine, unnamedResult, whyNoLint]
    revive:
      rules:
        # Return early instead of else branches.
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    presets: [comments, std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, unparam, noctx]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SoWieMarkus/wheelgpt
