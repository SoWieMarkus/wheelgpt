groups:
  - name: wheelgpt-backend
    rules:
      - alert: WheelGPTBackendDown
        expr: up{job="wheelgpt-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WheelGPT backend is not reachable

      - alert: WheelGPTHighErrorRate
        expr: |
          sum(rate(wheelgpt_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(wheelgpt_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of API requests fail with 5xx

      - alert: WheelGPTChatMessagesFailing
        expr: |
          sum(rate(wheelgpt_bot_chat_messages_total{outcome="error"}[15m]))
            / clamp_min(sum(rate(wheelgpt_bot_chat_messages_total[15m])), 1e-9) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 20% of chat replies fail, check the bot authorization and Twitch

      - alert: WheelGPTTwitchFailing
        expr: sum by (endpoint) (rate(wheelgpt_twitch_failed_requests_total[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Twitch requests to {{ $labels.endpoint }} keep failing"

      - alert: WheelGPTNoEventSub
        expr: |
          sum(increase(wheelgpt_eventsub_messages_total[6h])) == 0
            and on() wheelgpt_build_info
        for: 1h
        labels:
          severity: info
        annotations:
          summary: No EventSub message in 6 hours, are the subscriptions still enabled?
